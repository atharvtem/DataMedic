[project]
name = "datamedic"
version = "0.1.0"
description = "Budgeted, evidence-driven database incident investigation over MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14,<3",
    "langchain-mcp-adapters>=0.1,<0.2",
    "langgraph>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlglot>=28,<29",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
